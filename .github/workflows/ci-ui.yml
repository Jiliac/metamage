name: CI (ui)

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ci-ui.yml'
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ci-ui.yml'

permissions:
  contents: read

concurrency:
  group: ci-ui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui

jobs:
  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma runs real queries in generateStaticParams during next build,
      # so the build needs a reachable ops DB. Read-only role only.
      DATABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          # Version comes from "packageManager" in ui/package.json — one pin
          # shared by local, CI and Vercel.
          package_json_file: ui/package.json

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # No test script exists in ui (no vitest); adding one is out of scope.
      # Fork PRs receive no secrets, so DATABASE_URL is empty there and the
      # Prisma prerender would fail: skip the build with a visible notice and
      # let lint/format/typecheck stand as the fork verdict.
      - name: Build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm build

      - name: Build skipped (fork PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::build skipped — fork PR has no DATABASE_URL secret; a maintainer re-runs on an in-repo branch before merge"
