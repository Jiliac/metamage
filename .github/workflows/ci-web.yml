name: CI (web)

on:
  # No path filter on main: metamage-web's Vercel Deployment Checks require
  # this job before promoting to production, and Vercel decides whether to build
  # by diffing against the last successful deploy, not this push's `before`. A
  # filtered push could leave a production deploy waiting on a check that never runs.
  push:
    branches: [main]
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Version comes from "packageManager" in web/package.json — one pin
          # shared by local, CI and Vercel.
          package_json_file: web/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Vitest
        run: pnpm test

      # Hermetic build: DATA_SOURCE=fixtures (the default) needs no secrets.
      # Production builds against the live Postgres happen on Vercel (R7).
      - name: Build
        run: pnpm build
