name: CI (Python)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'visualize/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/ci-python.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'visualize/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/ci-python.yml'

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python / lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      # tests/ only: scripts/ holds executable probes (e.g.
      # scripts/test_social_post.py posts to real social APIs) that pytest
      # would otherwise collect and fail on — they are not unit tests.
      - name: Pytest
        run: uv run pytest tests -q

