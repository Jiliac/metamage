name: CI (Python)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'visualize/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/ci-python.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'visualize/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/ci-python.yml'

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      # Collection is scoped to tests/ via [tool.pytest.ini_options] testpaths
      # in pyproject.toml (scripts/ holds executable probes, not unit tests),
      # so local and CI collect the same set.
      - name: Pytest
        run: uv run pytest -q

